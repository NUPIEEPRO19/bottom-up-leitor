<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bottom Up 7.0 - Leitor</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 16px;

      font-family: Arial, sans-serif;

      background: #f4f6f8;
    }

    .container {
      width: 100%;
      max-width: 560px;

      background: white;

      padding: 24px;

      border-radius: 18px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);

      text-align: center;
    }

    h1 {
      margin: 0;

      font-size: 26px;

      color: #1f2937;
    }

    .subtitulo {
      margin-top: 8px;
      margin-bottom: 22px;

      color: #6b7280;

      font-size: 15px;
    }

    #reader {
      width: 100%;

      overflow: hidden;

      border-radius: 14px;

      background: #111827;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      transform: scaleX(-1);
    }

    #resultado {
      margin-top: 20px;

      padding: 16px;

      border-radius: 10px;

      background: #f3f4f6;

      color: #374151;

      font-weight: bold;

      line-height: 1.4;

      word-break: break-word;
    }

    .instrucoes {
      margin-top: 18px;

      color: #6b7280;

      font-size: 13px;

      line-height: 1.5;
    }

  </style>

</head>


<body>

  <main class="container">

    <h1>Bottom Up 7.0</h1>

    <div class="subtitulo">
      Sistema de Credenciamento
    </div>


    <div id="reader"></div>


    <div id="resultado">
      Aponte a câmera para o QR Code.
    </div>


    <div class="instrucoes">
      Mantenha o QR Code visível e evite reflexos na tela.
    </div>

  </main>


  <script>

    const resultado =
      document.getElementById("resultado");


    function leituraRealizada(token) {

      resultado.textContent =
        "QR Code identificado! Token: " + token;

    }


    function erroDeLeitura() {

      // Ignora erros momentâneos enquanto
      // o scanner procura um QR Code.

    }


    const scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 15,

        qrbox: function(viewfinderWidth, viewfinderHeight) {

          const tamanho =
            Math.floor(
              Math.min(viewfinderWidth, viewfinderHeight) * 0.75
            );

          return {
            width: tamanho,
            height: tamanho
          };

        },

        aspectRatio: 1.0

      },

      leituraRealizada,

      erroDeLeitura

    )

    .catch(function(erro) {

      console.error(erro);

      resultado.textContent =
        "Não foi possível acessar a câmera.";

    });

  </script>

</body>

</html>
