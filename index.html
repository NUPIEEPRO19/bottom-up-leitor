<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bottom Up 7.0 - Credenciamento</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 16px;

      font-family: Arial, sans-serif;

      background: #f4f6f8;
    }

    .container {
      width: 100%;
      max-width: 560px;

      background: white;

      padding: 24px;

      border-radius: 18px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .cabecalho {
      text-align: center;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;

      font-size: 26px;

      color: #1f2937;
    }

    .subtitulo {
      margin-top: 8px;

      color: #6b7280;

      font-size: 15px;
    }

    .grupo {
      margin-bottom: 18px;
    }

    .grupo-titulo {
      margin-bottom: 8px;

      font-size: 15px;

      font-weight: bold;

      color: #374151;
    }

    .opcoes {
      display: flex;
      gap: 10px;
    }

    .opcao {
      flex: 1;

      padding: 13px 10px;

      border: 1px solid #d1d5db;

      border-radius: 9px;

      background: white;

      color: #374151;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    .opcao:hover {
      background: #f3f4f6;
    }

    .opcao.ativo {
      background: #1f2937;

      color: white;

      border-color: #1f2937;
    }

    #reader {
      width: 100%;

      overflow: hidden;

      border-radius: 14px;

      background: #111827;

      min-height: 280px;

      display: flex;

      justify-content: center;

      align-items: center;
    }

    #reader video {
      width: 100% !important;

      height: auto !important;

      border-radius: 14px;
    }

    #resultado {
      margin-top: 20px;

      padding: 16px;

      border-radius: 10px;

      background: #f3f4f6;

      color: #374151;

      font-weight: bold;

      line-height: 1.4;

      white-space: pre-line;

      word-break: break-word;

      text-align: center;
    }

    #resultado.sucesso {
      background: #dcfce7;

      color: #166534;
    }

    #resultado.erro {
      background: #fee2e2;

      color: #991b1b;
    }

    #resultado.aviso {
      background: #fef3c7;

      color: #92400e;
    }

    .participante {
      display: none;

      margin-top: 15px;

      padding: 15px;

      border-radius: 10px;

      background: #f9fafb;

      color: #374151;

      text-align: left;
    }

    .participante p {
      margin: 6px 0;
    }

    .manual {
      margin-top: 22px;

      padding-top: 20px;

      border-top: 1px solid #e5e7eb;
    }

    .manual h3 {
      margin: 0 0 8px;

      font-size: 16px;

      color: #374151;
    }

    .manual p {
      margin: 0 0 12px;

      color: #6b7280;

      font-size: 13px;
    }

    .manual-linha {
      display: flex;

      gap: 8px;
    }

    .manual input {
      flex: 1;

      min-width: 0;

      padding: 12px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      font-size: 14px;

      outline: none;
    }

    .manual input:focus {
      border-color: #6b7280;
    }

    .manual button {
      padding: 12px 16px;

      border: none;

      border-radius: 8px;

      background: #1f2937;

      color: white;

      cursor: pointer;

      font-weight: bold;
    }

    .manual button:hover {
      background: #111827;
    }

    .instrucoes {
      margin-top: 16px;

      color: #6b7280;

      font-size: 13px;

      line-height: 1.5;

      text-align: center;
    }

    .rodape {
      margin-top: 20px;

      text-align: center;

      font-size: 12px;

      color: #9ca3af;
    }

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .container {
        padding: 20px;
      }

      .opcoes {
        gap: 7px;
      }

      .opcao {
        padding: 12px 6px;
      }

      .manual-linha {
        flex-direction: column;
      }

      .manual button {
        width: 100%;
      }

    }

  </style>

</head>


<body>

  <main class="container">

    <header class="cabecalho">

      <h1>Bottom Up 7.0</h1>

      <div class="subtitulo">
        Sistema de Credenciamento
      </div>

    </header>


    <section class="grupo">

      <div class="grupo-titulo">
        Dia do evento
      </div>

      <div class="opcoes">

        <button
          type="button"
          class="opcao ativo"
          id="dia1"
          onclick="selecionarDia('Dia 1')"
        >
          Dia 1
        </button>

        <button
          type="button"
          class="opcao"
          id="dia2"
          onclick="selecionarDia('Dia 2')"
        >
          Dia 2
        </button>

      </div>

    </section>


    <section class="grupo">

      <div class="grupo-titulo">
        Tipo de registro
      </div>

      <div class="opcoes">

        <button
          type="button"
          class="opcao ativo"
          id="entrada"
          onclick="selecionarTipo('Entrada')"
        >
          Entrada
        </button>

        <button
          type="button"
          class="opcao"
          id="saida"
          onclick="selecionarTipo('Saída')"
        >
          Saída
        </button>

      </div>

    </section>


    <div id="reader"></div>


    <div id="resultado">
      Aguardando leitura do QR Code...
    </div>


    <section
      id="participante"
      class="participante"
    >

      <p>
        <strong>Nome:</strong>
        <span id="nomeParticipante"></span>
      </p>

      <p>
        <strong>ID:</strong>
        <span id="idParticipante"></span>
      </p>

    </section>


    <section class="manual">

      <h3>
        Credenciamento manual
      </h3>

      <p>
        Caso seja necessário, digite o token do participante.
      </p>

      <div class="manual-linha">

        <input
          type="text"
          id="tokenManual"
          placeholder="Digite o token"
          autocomplete="off"
        >

        <button
          type="button"
          onclick="credenciarManual()"
        >
          Credenciar
        </button>

      </div>

    </section>


    <div class="instrucoes">
      Mantenha o QR Code visível e evite reflexos na tela.
    </div>


    <footer class="rodape">
      Bottom Up 7.0
    </footer>

  </main>


  <script>

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbweKHfR198LnCnQ_JIZjuibYKk-91e7ypIjtRRimvinjL9S7H8D_5mrnFXxSEsiP4IaDQ/exec";


    let diaSelecionado = "Dia 1";

    let tipoSelecionado = "Entrada";

    let processando = false;

    let cameraIniciada = false;


    const resultado =
      document.getElementById("resultado");

    const participante =
      document.getElementById("participante");

    const nomeParticipante =
      document.getElementById("nomeParticipante");

    const idParticipante =
      document.getElementById("idParticipante");

    const tokenManual =
      document.getElementById("tokenManual");


    function selecionarDia(dia) {

      diaSelecionado = dia;

      document
        .getElementById("dia1")
        .classList
        .toggle("ativo", dia === "Dia 1");

      document
        .getElementById("dia2")
        .classList
        .toggle("ativo", dia === "Dia 2");

      atualizarStatus(
        dia + " selecionado. " +
        tipoSelecionado +
        " aguardando leitura."
      );

    }


    function selecionarTipo(tipo) {

      tipoSelecionado = tipo;

      document
        .getElementById("entrada")
        .classList
        .toggle("ativo", tipo === "Entrada");

      document
        .getElementById("saida")
        .classList
        .toggle("ativo", tipo === "Saída");

      atualizarStatus(
        diaSelecionado + " - " +
        tipo +
        " aguardando leitura."
      );

    }


    function atualizarStatus(
      mensagem,
      tipo = ""
    ) {

      resultado.textContent = mensagem;

      resultado.className = "";

      resultado.id = "resultado";

      if (tipo) {
        resultado.classList.add(tipo);
      }

    }


    function mostrarParticipante(
      nome,
      id
    ) {

      nomeParticipante.textContent =
        nome || "-";

      idParticipante.textContent =
        id || "-";

      participante.style.display =
        "block";

    }


    function esconderParticipante() {

      participante.style.display =
        "none";

      nomeParticipante.textContent =
        "";

      idParticipante.textContent =
        "";

    }


    function pararCamera() {

      if (!cameraIniciada) {
        return Promise.resolve();
      }

      return scanner
        .stop()
        .then(function() {

          cameraIniciada = false;

        })
        .catch(function(erro) {

          console.warn(
            "Não foi possível parar a câmera:",
            erro
          );

          cameraIniciada = false;

        });

    }


    function iniciarCamera() {

      if (cameraIniciada) {
        return Promise.resolve();
      }

      return scanner
        .start(

          {
            facingMode: "environment"
          },

          {
            fps: 15,

            qrbox:
              function(
                viewfinderWidth,
                viewfinderHeight
              ) {

                const tamanho =
                  Math.floor(
                    Math.min(
                      viewfinderWidth,
                      viewfinderHeight
                    ) * 0.75
                  );

                return {
                  width: tamanho,
                  height: tamanho
                };

              },

            aspectRatio: 1.0

          },

          leituraRealizada,

          erroDeLeitura

        )
        .then(function() {

          cameraIniciada = true;

          atualizarStatus(
            diaSelecionado +
            " - " +
            tipoSelecionado +
            " aguardando leitura."
          );

        });

    }


    function leituraRealizada(token) {

      if (processando) {
        return;
      }

      processando = true;

      atualizarStatus(
        "QR Code identificado. Processando...",
        "aviso"
      );

      esconderParticipante();


      /*
       * Assim que o QR é identificado,
       * paramos a câmera.
       *
       * O token já foi capturado.
       * Portanto, a pessoa pode retirar
       * o celular sem interromper o processamento.
       */

      pararCamera()
        .then(function() {

          return fetch(
            URL_APPS_SCRIPT,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({

                token: token,

                dia: diaSelecionado,

                tipo: tipoSelecionado

              })

            }
          );

        })

        .then(function(resposta) {

          if (!resposta.ok) {

            throw new Error(
              "HTTP " + resposta.status
            );

          }

          return resposta.json();

        })

        .then(function(dados) {

          if (dados.sucesso) {

            mostrarParticipante(
              dados.participante.nome,
              dados.participante.id
            );

            atualizarStatus(
              "✅ " + dados.mensagem,
              "sucesso"
            );

          } else {

            if (dados.participante) {

              mostrarParticipante(
                dados.participante.nome,
                dados.participante.id
              );

            }

            atualizarStatus(
              "⚠️ " + dados.mensagem,
              "erro"
            );

          }

        })

        .catch(function(erro) {

          console.error(erro);

          atualizarStatus(
            "❌ Não foi possível comunicar com o sistema de credenciamento.",
            "erro"
          );

        })

        .finally(function() {

          processando = false;

          /*
           * Pequena pausa para que o resultado
           * fique visível antes de liberar
           * a câmera novamente.
           */

          setTimeout(function() {

            iniciarCamera()
              .catch(function(erro) {

                console.error(
                  "Erro ao reiniciar câmera:",
                  erro
                );

                atualizarStatus(
                  "A câmera precisa ser reiniciada.",
                  "erro"
                );

              });

          }, 800);

        });

    }


    function credenciarManual() {

      const token =
        tokenManual.value.trim();

      if (!token) {

        atualizarStatus(
          "Digite um token para realizar o credenciamento.",
          "aviso"
        );

        tokenManual.focus();

        return;

      }

      if (processando) {
        return;
      }

      processando = true;

      tokenManual.value = "";

      atualizarStatus(
        "Token informado. Processando...",
        "aviso"
      );

      fetch(
        URL_APPS_SCRIPT,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            token: token,

            dia: diaSelecionado,

            tipo: tipoSelecionado

          })

        }
      )

      .then(function(resposta) {

        if (!resposta.ok) {

          throw new Error(
            "HTTP " + resposta.status
          );

        }

        return resposta.json();

      })

      .then(function(dados) {

        if (dados.sucesso) {

          mostrarParticipante(
            dados.participante.nome,
            dados.participante.id
          );

          atualizarStatus(
            "✅ " + dados.mensagem,
            "sucesso"
          );

        } else {

          atualizarStatus(
            "⚠️ " + dados.mensagem,
            "erro"
          );

        }

      })

      .catch(function(erro) {

        console.error(erro);

        atualizarStatus(
          "❌ Não foi possível comunicar com o sistema de credenciamento.",
          "erro"
        );

      })

      .finally(function() {

        processando = false;

      });

    }


    tokenManual.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          credenciarManual();

        }

      }
    );


    function erroDeLeitura() {

      // Erros momentâneos de leitura
      // são ignorados enquanto o scanner procura o QR Code.

    }


    const scanner =
      new Html5Qrcode("reader");


    iniciarCamera()
      .catch(function(erro) {

        console.error(erro);

        atualizarStatus(
          "Não foi possível acessar a câmera. Use o credenciamento manual.",
          "erro"
        );

      });

  </script>

</body>

</html>
